# Experiment settings. Command-line options override these (e.g. --seeds 3 --duration-ms 5000).

# Postgres from docker-compose.yml
db=jdbc:postgresql://localhost:55432/skewer

# Seeds per cell; seeds are baseSeed, baseSeed+1, ... (omit baseSeed for a random one, printed in the report)
seeds=5
baseSeed=1000

# Run length per seed: whichever comes first
durationMs=8000
maxOps=6000

# Throughput baseline per cell with instrumentation switched off
baseline=true
baselineDurationMs=5000

# End-to-end controls run after the matrix
negativeRuns=30
positiveRuns=20
controlDurationMs=10000

output=experiments/results
